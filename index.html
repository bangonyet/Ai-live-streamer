<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Live Streamer - @creatortiktok</title>
  <script src="https://tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword, signInWithPhoneNumber, RecaptchaVerifier, OAuthProvider, signInWithPopup } from "https://gstatic.com";
    const app = initializeApp({ apiKey: "API_KEY", authDomain: "://firebaseapp.com" });
    const auth = getAuth(app);
    window.login = async (type) => {
      const user = document.getElementById('user').value;
      try {
        if (type === 'email') await signInWithEmailAndPassword(auth, user, prompt("Password:"));
        if (type === 'hp') { window.rv = new RecaptchaVerifier(auth, 'rc', {size:'invisible'}); const c = await signInWithPhoneNumber(auth, user, window.rv); await c.confirm(prompt("Kode OTP:")); }
        if (type === 'tiktok') await signInWithPopup(auth, new OAuthProvider('oidc.tiktok'));
        alert("Login Berhasil! Lanjut Slide 2");
      } catch (e) { alert("Error: " + e.message); }
    };
  </script>
</head>
<body class="bg-cover bg-center h-screen flex flex-col justify-between p-4 text-white" style="background-image: url('https://unsplash.com');">
  <div class="flex justify-between items-center bg-slate-900/70 backdrop-blur-md p-3 rounded-xl border border-teal-500/30 text-sm">
    <span>AI Live Streamer</span><span class="text-teal-300 font-bold">@creatortiktok</span><span class="bg-slate-800 px-2 py-1 rounded">Slide 1 / 6</span>
  </div>
  <div class="mx-auto w-full max-w-sm bg-slate-900/60 backdrop-blur-lg p-6 rounded-2xl border border-teal-400/50 shadow-[0_0_20px_rgba(45,212,191,0.3)] space-y-3 text-center">
    <h2 class="text-lg font-semibold mb-3">1. Masuk ke Studio AI Live</h2>
    <input id="user" placeholder="Email / No. HP (+62...) / Username" class="w-full p-2.5 rounded-lg bg-slate-950/80 border border-teal-400 text-sm text-center outline-none">
    <button onclick="login('email')" class="w-full py-2.5 rounded-lg bg-slate-900 border border-teal-400 hover:bg-teal-500/20 text-sm">Masuk dengan Email</button>
    <button onclick="login('tiktok')" class="w-full py-2.5 rounded-lg bg-slate-900 border border-purple-500 hover:bg-purple-500/20 text-sm">Masuk dengan TikTok</button>
    <button onclick="login('hp')" class="w-full py-2.5 rounded-lg bg-slate-900 border border-emerald-400 hover:bg-emerald-500/20 text-sm">Masuk dengan Nomor HP (OTP)</button>
    <div id="rc"></div>
  </div>
  <div class="flex justify-between bg-slate-900/70 backdrop-blur-md p-2 rounded-xl border border-slate-700">
    <button class="px-4 py-1.5 rounded-lg bg-slate-800 text-xs text-gray-400">← Back</button>
    <button onclick="alert('Ke Slide 2: Pilih Avatar')" class="px-4 py-1.5 rounded-lg bg-emerald-400 text-slate-950 font-bold text-xs">Next →</button>
  </div>
</body>
</html>
